<h2>📝 Cadastro de Livro</h2>

<form (ngSubmit)="incluir()" #formRef="ngForm" novalidate class="mt-3">
  <div class="form-group mb-3">
    <label for="titulo">Título:</label>
    <input
      type="text"
      id="titulo"
      class="form-control"
      required
      [(ngModel)]="livro.titulo"
      name="titulo"
      #titulo="ngModel"
    />
    <div *ngIf="titulo.invalid && titulo.touched" class="text-danger">
      O título é obrigatório.
    </div>
  </div>

  <div class="form-group mb-3">
    <label for="resumo">Resumo:</label>
    <textarea
      id="resumo"
      class="form-control"
      rows="3"
      [(ngModel)]="livro.resumo"
      name="resumo"
    ></textarea>
  </div>

  <div class="form-group mb-3">
    <label for="editora">Editora:</label>
    <select
      id="editora"
      class="form-select"
      required
      [(ngModel)]="livro.codEditora"
      name="codEditora"
      #codEditora="ngModel"
    >
      <option [ngValue]="null">-- selecione --</option>
      <option *ngFor="let e of editoras" [value]="e.codEditora">
        {{ e.nome }}
      </option>
    </select>
    <div *ngIf="codEditora.invalid && codEditora.touched" class="text-danger">
      Selecione uma editora.
    </div>
  </div>

  <div class="form-group mb-3">
    <label for="autor">Autores:</label>
    <div class="input-group">
      <input
        type="text"
        id="autor"
        class="form-control"
        placeholder="Digite o nome do autor"
        [(ngModel)]="autorTemp"
        name="autorTemp"
      />
      <button type="button" class="btn btn-secondary" (click)="adicionarAutor()">
        Adicionar
      </button>
    </div>

    <ul class="list-group mt-2" *ngIf="livro.autores.length > 0">
      <li
        class="list-group-item d-flex justify-content-between align-items-center"
        *ngFor="let a of livro.autores; let i = index"
      >
        {{ a }}
        <button
          type="button"
          class="btn btn-sm btn-outline-danger"
          (click)="removerAutor(i)"
        >
          X
        </button>
      </li>
    </ul>
  </div>

  <button
    type="submit"
    class="btn btn-primary mt-3"
    [disabled]="formRef.invalid"
  >
    Salvar
  </button>
</form>
